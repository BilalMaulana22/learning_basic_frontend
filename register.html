<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form action="#" method="POST">
        <h2>Daftar Akun Baru</h2>

        <div class="input-group">
            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
        </div>

        <div class="input-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="contoh@mail.com" required>
        </div>

        <div class="input-group">
            <label for="telp">Nomor Telpon:</label>
            <input type="tel" id="telp" name="telp" placeholder="0812xxxx" required>
        </div>

        <div class="input-group">
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" placeholder="Minimal 6 karakter" required>
        </div>

        <button type="submit">Register</button>

        <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>
    </form>

    <script>
      const form = document.querySelector('form');
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const nama = document.getElementById('nama').value;
        const email = document.getElementById('email').value;
        console.log("--- Data Registrasi ---");
        console.log("Nama: " + nama);
        console.log("Email: " + email);
        alert('Registrasi Berhasil (Simulasi)! Cek Console (F12)');
      });
    </script>
</body>
</html>
