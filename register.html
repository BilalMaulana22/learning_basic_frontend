<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun</title>
    <!-- PASTIKAN LINE INI ADA -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="auth-container">
        <h2>Register</h2>
        <p class="subtitle">Buat akun barumu sekarang</p>
        
        <form action="#">
            <div class="input-group">
                <label for="fullname">Nama Lengkap</label>
                <input type="text" id="fullname" placeholder="Masukkan Nama Lengkap" required>
            </div>

            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Masukkan Email" required>
            </div>
            <!-- Input Nomor Telepon -->
            <div class="input-group">
                <label for="phone">Nomor Telepon</label>
                <input type="tel" id="phone" placeholder="Contoh: 08123456789" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Buat Password" required>
            </div>

            <button type="submit" class="btn-auth">Daftar</button>
        </form>
        
        <p class="switch-text">
            Sudah punya akun? <a href="login.html">Login di sini</a>
        </p>
    </div>
</body>
</html>
