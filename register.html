<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Semua elemen harus ada di dalam tag form ini agar masuk ke kotak putih -->
    <form action="#" method="POST">
        <h2>Daftar Akun Baru</h2>

        <div class="input-group">
            <label for="nama">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>
        </div>

        <div class="input-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="input-group">
            <label for="telp">Nomor Telpon:</label>
            <input type="tel" id="telp" name="telp" required>
        </div>

        <div class="input-group">
            <label for="pass">Password:</label>
            <input type="password" id="pass" name="pass" required>
        </div>

        <button type="submit">Register</button>

        <p>Sudah punya akun? <a href="login.html">Login di sini</a></p>
    </form>

</body>
</html>
    <!-- ... kode form kamu ... -->

    <script>
      const form = document.querySelector('form');
      
      form.addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        // Mengambil data berdasarkan urutan atau tipe input
        const nama = document.querySelector('input[type="text"]').value; 
        const email = document.querySelector('input[type="email"]').value;
        const telp = document.querySelector('input[type="tel"]').value;
        const password = document.querySelector('input[type="password"]').value;

        console.log("--- Data Pendaftaran Baru ---");
        console.log("Nama Lengkap: " + nama);
        console.log("Email: " + email);
        console.log("Nomor Telpon: " + telp);
        console.log("Password: " + password);
        
        alert('Pendaftaran berhasil disimulasikan! Cek Console (F12).');
      });
    </script>
</body>
