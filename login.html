<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="login-container">
    <h2>Login</h2>

    <form id="loginForm">
        <input
            type="text"
            id="username"
            placeholder="Masukkan Username"
            required
        >

        <input
            type="password"
            id="password"
            placeholder="Masukkan Password"
            required
        >

        <button type="submit">Masuk</button>
    </form>

    <p id="message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
    <!-- ... kode form kamu ... -->

    <script>
      const form = document.querySelector('form');
      
      form.addEventListener('submit', function(e) {
        e.preventDefault(); 
        
        // Mengambil data. Tips: Jika input username menggunakan type="text", 
        // pastikan querySelector-nya tepat.
        const user = document.querySelector('input[type="text"]').value;
        const password = document.querySelector('input[type="password"]').value;

        console.log("--- Data Login ---");
        console.log("Username/Email: " + user);
        console.log("Password: " + password);
        
        alert('Login disimulasikan! Silakan tekan F12 dan cek tab "Console" untuk melihat data kamu.');
      });
    </script>
</body>
